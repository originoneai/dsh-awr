goals:
- id: primitive-grouping-ig
  status: candidate
  success_criteria:
  - 'Short-term: a document records consensus on requirements and an evaluation of existing approaches (README.md).'
  - 'Medium-term: a written recommendation selects a convention, a protocol extension, or both (README.md).'
  - 'Long-term: an interoperable grouping convention is demonstrated across MCP servers and clients (README.md).'
  summary: |-
    The Primitive Grouping Interest Group explores how MCP Primitives (Tools, Resources, Prompts, Tasks) might be organized beyond the flat lists maintained by the protocol, and how such organization might benefit MCP servers and clients. Its stated outputs are requirements gathering, pattern exploration, and a shared repository of reference implementations and experimental findings; it does not approve spec changes or mandate implementation behavior, and its contents are exploratory rather than official MCP specifications.

    Provenance: README.md, CONTRIBUTING.md, docs/experimental-findings.md, experiments/deterministic-groups/README.md, experiments/deterministic-groups/conformance/README.md
  title: Explore organization of MCP primitives beyond flat lists
