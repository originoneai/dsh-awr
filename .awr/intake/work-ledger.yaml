- id: DSH-004
  title: Get stock awr-mcp accepted by DSH's MCP client
  kind: defect
  status: completed
  priority: P0
  required: true
  goal: intake-goal
  depends_on: []
  summary: DSH 0.2.2-rc.1 rejects the tools/list result of awr-mcp 0.7.0 because ttlMs and cacheScope are missing under protocol 2026-07-28, so the server is reported as disconnected. Found in the DSH-001 check; see docs/dsh-001-l0-check.md. The owner decided on 2026-11-11 that the fix lives in AWR and not in this plugin, because every host that speaks protocol 2026-07-28 hits the same missing fields. It was reported as originoneai/awr#613 and is fixed by PR 614.
  acceptance:
  - Without any shim, an awr-mcp entry in a DSH 0.2.2-rc.1 profile stays connected and awr_query with child_tool awr_project_status returns the fixture project's identity.
  - The decision on where the fix lives (AWR or this plugin) and its reason are recorded.
  next_action: "Complete DSH-004 with the registered evidence"
  "evidence": ["docs/evidence/DSH-004/completion-report.json"]
  "verification": {"evidence_level":"locally_verified"}
- id: DSH-016
  title: Map a forked DSH conversation to the parent's AWR session
  kind: implementation
  status: completed
  priority: P2
  required: false
  goal: intake-goal
  depends_on: [DSH-013]
  summary: Split out of DSH-013. A fork gets a new DSH session id, so the plugin binds it as a new conversation. Continuing the parent's AWR session needs the parent's id (awr client bind with from-session), and creating a fork and reading its parent were not exercised.
  acceptance:
  - In DeepSeek Harness, a forked conversation is matched to its parent conversation. When the parent's AWR session has ended, the fork is bound with from-session pointing at that session, shown by session show on the parent. When the parent's session is still active, the fork gets its own session and the parent's session and claims are left as they are (from-session would interrupt the parent session and close its claims).
  - A fork whose parent was never bound is bound as a new conversation.
  next_action: Complete DSH-016 with the registered evidence
  "evidence": ["docs/evidence/DSH-016/completion-report.json"]
  "verification": {"evidence_level":"locally_verified"}
