  summary: Nothing in this repository has been run against DSH. Establish the baseline on a disposable project before writing plugin code. Run against the lab AWR build (docs/lab-environment.md); stock released awr-mcp is tracked separately by DSH-004.
  acceptance:
  - The DSH version, install source and check date are recorded in this repository.
  - From a DSH conversation, awr session start, context compile, session checkpoint and session end succeed on a disposable AWR project and their receipts are retained.
  - awr-mcp is connected to DSH and awr_project_status returns the disposable project's identity.
  next_action: Complete DSH-001 with docs/dsh-001-l0-check.md and docs/evidence/DSH-001 as evidence.
