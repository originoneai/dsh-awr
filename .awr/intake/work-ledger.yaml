  "summary": "Reported by a user: the AWR panel said '这个文件夹范围太大，不适合当作一个项目' for an ordinary folder on Windows. takeoverRootFor in lib/takeover-host.js measured path depth with split('/'), which counts a Windows path as one segment, so every Windows directory was refused as too broad. Fixed by extracting tooBroadRoot(), which splits on both separators and keeps the filesystem-root and home refusals; PR #42, commit 6b4f6d0 on fix/windows-too-broad."
