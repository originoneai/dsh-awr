- id: DSH-011
  title: Select the awr binary and refuse to run on an incompatible runtime
  kind: implementation
  status: planned
  priority: P0
  required: true
  goal: intake-goal
  depends_on: [DSH-010]
  acceptance:
  - The plugin uses the cli path from .awr/runtime-binding.json when present and awr on PATH otherwise.
  - A missing binary, schema mismatch, Unsupported result or migration prompt stops the plugin with a visible message and performs no migrate, restore or downgrade.
  - Tests cover the bound, unbound, missing and mismatch cases.
  next_action: Implement the resolver and an argv runner that every other capability calls.
- id: DSH-012
  title: Mount awr-mcp for the session's project
  kind: implementation
  status: planned
  priority: P0
  required: true
  goal: intake-goal
  depends_on: [DSH-011]
  acceptance:
  - In a DSH conversation opened on an initialized AWR project, the model can call awr_project_status and receives that project's identity.
  - Two conversations on different projects do not see each other's project.
  next_action: Ship a bundle patch row for @deepseek-ai/dsh-mcp-client (ctx.mcpManager does not exist in 0.2.2-rc.1; see docs/dsh-surfaces.md) that starts the native awr-mcp with the project root as --project and cwd.
- id: DSH-013
  title: Bind each DSH conversation to an AWR session without claiming
  kind: implementation
  status: planned
  priority: P0
  required: true
  goal: intake-goal
  depends_on: [DSH-011]
  acceptance:
  - A new DSH conversation produces an AWR client binding with client generic and external session dsh:<session id>.
  - Binding never acquires a claim and never takes over another active session's claim.
  - A forked or resumed DSH conversation maps to the correct AWR session, shown by session show.
  next_action: Implement the bind call in an agent/created listener (serial, awaited; payload agent and source). Do not persist the mapping in DSH; AWR already stores it (awr client bind).
- id: DSH-014
  title: Inject AWR work context into the DSH prompt
  kind: implementation
  status: planned
  priority: P0
  required: true
  goal: intake-goal
  depends_on: [DSH-013]
  acceptance:
  - The assembled prompt contains the bound work's next action, open loops and compiled context.
  - After a native compaction the injected context is present again in the next request.
  - SourceStale and BudgetExceeded are surfaced to the conversation and are not bypassed or truncated away.
  next_action: Register a required prompt context that renders from awr status and context compile, cached by project revision.
- id: DSH-015
  title: Provide /awr slash commands for status, claim, checkpoint and end
  kind: implementation
  status: planned
  priority: P0
  required: true
  goal: intake-goal
  depends_on: [DSH-013]
  acceptance:
  - Each command runs the matching awr operation and shows its result or error.
  - Every mutating command sends the current expected revision and reports a revision conflict instead of retrying blindly.
  next_action: Register the commands on the confirmed command registry surface.
- id: DSH-020
  title: Build the unattended takeover orchestration as a host-independent module
  kind: implementation
  status: planned
  priority: P0
  required: true
  goal: intake-goal
  depends_on: [DSH-011]
  summary: Preflight, init preview, draft handoff, fingerprint-checked accept and the bounded intake inspect loop. It calls awr only through argv and uses no DSH API, so it can later move into the AWR CLI.
  acceptance:
  - Given a draft-review callback, the module takes an uninitialized fixture project to an accepted init and a final intake inspect result with no human input.
  - Each step is persisted and a run interrupted at any step resumes from that step.
  - A failure before accept leaves the fixture project byte-identical.
  - Secret-boundary hits, source_unreadable, Unsupported, migration prompts and an existing active session each stop the run with a recorded reason.
  - Default runs write only under .awr/ and never commit or push.
  next_action: Define the step state machine and its persisted record, then implement it against fixture projects.
- id: DSH-021
  title: Add the takeover button, background subagent and receipt panel in DSH
  kind: implementation
  status: planned
  priority: P0
  required: true
  goal: intake-goal
  depends_on: [DSH-020, DSH-002]
  acceptance:
  - One click on an uninitialized project starts the run in the background and the user's conversation stays usable.
  - The draft-review step runs in a subagent limited to reading files, calling awr and writing the takeover scope.
  - Goals the material cannot establish are recorded as candidate or needs_confirmation and no question is asked during the run.
  - The receipt lists what was mapped, what was created and what awaits confirmation.
  next_action: Wire the DSH-020 module to a DSH command and client entry point using the surfaces confirmed in DSH-002.
- id: DSH-022
  title: Prove the one-click takeover on real existing projects
  kind: verification
  status: planned
  priority: P0
  required: true
  goal: intake-goal
  depends_on: [DSH-021, DSH-012, DSH-013, DSH-014]
  acceptance:
  - On at least two existing projects with prior development history, one click reaches a final organization state with no human input, and the receipts are retained.
  - For each project the resulting goals and work items are reviewed against its README and history, and any invented or wrong intent is recorded as a defect.
  - After takeover, a new DSH conversation on the project shows the AWR context without further setup.
  next_action: Pick two existing projects with the owner, run the takeover on copies, and record the results.
- id: DSH-030
  title: Prompt for AWR checkpoints at turn boundaries
  kind: implementation
  status: planned
  priority: P1
  required: false
  goal: intake-goal
  depends_on: [DSH-013]
  summary: DSH has no hook before compaction (only the compaction/summary-error recovery waterfall), so checkpoints have to be saved ahead of it, at turn boundaries.
  acceptance:
  - After meaningful turns the model is prompted to checkpoint and the saved digest, next action and open loops are written by the model from the conversation, not generated by the plugin.
  - A session disposal never ends the AWR session as completed.
  next_action: Use the agent/turn-stopping event, whose listener may call agent.steer to keep the turn open, and define when a checkpoint prompt is issued.
- id: DSH-031
  title: Report native compactions to AWR
  kind: implementation
  status: planned
  priority: P1
  required: false
  goal: intake-goal
  depends_on: [DSH-013]
  acceptance:
  - Each completed DSH compaction is recorded through AWR's context-continuity protocol with the measurement scope and basis DSH actually provides.
  - Estimated values are reported as estimated and are never presented as host-reported occupancy.
  next_action: Map DSH compaction session events to the observation request and confirm which token figures exist.
- id: DSH-032
  title: Bundle a skill that teaches the AWR workflow
  kind: implementation
  status: planned
  priority: P1
  required: false
  goal: intake-goal
  depends_on: [DSH-010]
  acceptance:
  - The skill is discovered by DSH and covers preview then accept, expected revisions, evidence registration and the conditions for work complete.
  next_action: Write the skill and confirm DSH's skill discovery path for plugin-bundled skills.
- id: DSH-040
  title: Decide whether the takeover orchestration moves into the AWR CLI
  kind: decision
  status: planned
  priority: P1
  required: false
  goal: intake-goal
  depends_on: [DSH-022]
